:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
  #daily-review-app {
    --dr-bg: light-dark(#f4f4f0, #171816);

    --dr-text: light-dark(#24251f, #f1f1e9);
    --dr-muted: light-dark(#74756d, #aeb0a6);
    --dr-border: light-dark(#e3e4dc, #3b3d36);
    --dr-accent: light-dark(#456447, #a8c9a4);
    --dr-accent-strong: light-dark(#28482c, #c6e7c0);
    --dr-accent-soft: light-dark(#e7efe4, #344234);

    --dr-warm: light-dark(#f1e6d6, #493d30);
    --dr-shadow: light-dark(0 14px 40px rgba(45, 48, 39, .08), 0 14px 40px rgba(0, 0, 0, .24));
    color-scheme: light dark;
    display: grid;
    grid-template-columns: 184px minmax(0, 1fr);
    min-height: 720px;
    background: var(--dr-bg);
    color: var(--dr-text);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, sans-serif;
    border: 1px solid var(--dr-border);
    border-radius: 20px;
    overflow: hidden;
  }

  #daily-review-app button, #daily-review-app input, #daily-review-app select, #daily-review-app textarea { font: inherit; }
  #daily-review-app button { color: inherit; }
  #daily-review-app .dr-sidebar { background: var(--dr-surface); border-right: 1px solid var(--dr-border); padding: 24px 14px 16px; display: flex; flex-direction: column; gap: 28px; }

  #daily-review-app .dr-primary-button:hover { filter: brightness(1.08); }

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;daily-review-app&#x27;);
    const navItems = root.querySelectorAll(&#x27;.dr-nav-item&#x27;);
    const panels = root.querySelectorAll(&#x27;.dr-view&#x27;);
    const toast = root.querySelector(&#x27;#dr-toast&#x27;);
    let toastTimer;
    const showToast = (message) =&gt; {
      toast.querySelector(&#x27;span&#x27;).textContent = message;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() =&gt; { toast.hidden = true; }, 2200);
    };

    navItems.forEach((item) =&gt; {
      item.addEventListener(&#x27;click&#x27;, () =&gt; {
        navItems.forEach((node) =&gt; { node.classList.remove(&#x27;is-active&#x27;); node.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;); });
        panels.forEach((panel) =&gt; panel.classList.remove(&#x27;is-visible&#x27;));
        item.classList.add(&#x27;is-active&#x27;);
        item.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
        root.querySelector(`[data-panel=&quot;${item.dataset.view}&quot;]`).classList.add(&#x27;is-visible&#x27;);
      });
    });

    const refreshDone = () =&gt; {
      const checked = root.querySelectorAll(&#x27;#dr-task-list .dr-check input:checked&#x27;).length;
      root.querySelector(&#x27;#dr-done-count&#x27;).textContent = checked;
    };
    root.querySelectorAll(&#x27;#dr-task-list .dr-check input&#x27;).forEach((input) =&gt; {
      input.addEventListener(&#x27;change&#x27;, () =&gt; {
        input.closest(&#x27;.dr-task&#x27;).classList.toggle(&#x27;is-done&#x27;, input.checked);
        refreshDone();
      });
    });

    const addForm = root.querySelector(&#x27;#dr-add-form&#x27;);
    root.querySelector(&#x27;#dr-show-add&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
      addForm.hidden = !addForm.hidden;
      if (!addForm.hidden) root.querySelector(&#x27;#dr-new-task&#x27;).focus();
    });
    const estimateNote = root.querySelector(&#x27;#dr-estimate-note&#x27;);
    root.querySelector(&#x27;#dr-auto-estimate&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
      const title = root.querySelector(&#x27;#dr-new-task&#x27;).value.trim();
      if (!title) {
        estimateNote.textContent = &#x27;先输入任务名称，再根据历史记录估时&#x27;;
        estimateNote.hidden = false;
        root.querySelector(&#x27;#dr-new-task&#x27;).focus();
        return;
      }
      let suggestion = &#x27;45 分钟&#x27;;
      let evidence = &#x27;基于 6 次相似任务，中位数 43 分钟&#x27;;
      if (/邮件|消息|回复/.test(title)) {
        suggestion = &#x27;30 分钟&#x27;;
        evidence = &#x27;基于 8 次相似任务，中位数 26 分钟&#x27;;
      } else if (/写|方案|季度|报告/.test(title)) {
        suggestion = &#x27;2 小时&#x27;;
        evidence = &#x27;基于 5 次写作任务，中位数 1 小时 52 分&#x27;;
      } else if (/会议|沟通|评审/.test(title)) {
        suggestion = &#x27;1 小时&#x27;;
        evidence = &#x27;基于 7 次相似任务，中位数 55 分钟&#x27;;
      }
      root.querySelector(&#x27;#dr-new-time&#x27;).value = suggestion;
      estimateNote.textContent = `建议 ${suggestion} · ${evidence}，你仍可修改`;
      estimateNote.hidden = false;
    });
    addForm.addEventListener(&#x27;submit&#x27;, (event) =&gt; {
      event.preventDefault();
      const title = root.querySelector(&#x27;#dr-new-task&#x27;).value.trim();
      const time = root.querySelector(&#x27;#dr-new-time&#x27;).value;
      if (!title) return;
      const task = document.createElement(&#x27;article&#x27;);
      task.className = &#x27;dr-task&#x27;;
      task.innerHTML = `&lt;label class=&quot;dr-check&quot;&gt;&lt;input type=&quot;checkbox&quot;&gt;&lt;span aria-hidden=&quot;true&quot;&gt;&lt;i data-lucide=&quot;check&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;/label&gt;&lt;div class=&quot;dr-task-copy&quot;&gt;&lt;h3&gt;&lt;/h3&gt;&lt;p&gt;&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;dr-start-button&quot;&gt;开始&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;dr-task-more&quot; aria-label=&quot;更多操作&quot;&gt;&lt;i data-lucide=&quot;ellipsis&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;`;
      task.querySelector(&#x27;h3&#x27;).textContent = title;
      task.querySelector(&#x27;p&#x27;).textContent = `${time} · 自定义`;
      task.querySelector(&#x27;input&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; { task.classList.toggle(&#x27;is-done&#x27;, event.target.checked); refreshDone(); });
      root.querySelector(&#x27;#dr-task-list&#x27;).appendChild(task);
      root.querySelector(&#x27;#dr-new-task&#x27;).value = &#x27;&#x27;;
      estimateNote.hidden = true;
      addForm.hidden = true;
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      showToast(&#x27;任务已加入今天&#x27;);
    });

    let seconds = 2 * 60 + 42;
    let running = true;
    let estimateNoticeShown = false;
    const timerDisplay = root.querySelector(&#x27;.dr-timer&#x27;);
    const timerToggle = root.querySelector(&#x27;.dr-timer-toggle&#x27;);
    const renderTimer = () =&gt; {
      const hours = Math.floor(seconds / 3600).toString().padStart(2, &#x27;0&#x27;);
      const minutes = Math.floor((seconds % 3600) / 60).toString().padStart(2, &#x27;0&#x27;);
      const secs = (seconds % 60).toString().padStart(2, &#x27;0&#x27;);
      timerDisplay.textContent = `${hours}:${minutes}:${secs}`;
    };
    setInterval(() =&gt; {
      if (!running) return;
      seconds += 1;
      renderTimer();
      if (seconds &gt;= 45 * 60 &amp;&amp; !estimateNoticeShown) {
        estimateNoticeShown = true;
        showToast(&#x27;已达到预计 45 分钟，可以继续或完成任务&#x27;);
      }
    }, 1000);
    timerToggle.addEventListener(&#x27;click&#x27;, () =&gt; {
      running = !running;
      timerToggle.innerHTML = running ? &#x27;&lt;i data-lucide=&quot;pause&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27; : &#x27;&lt;i data-lucide=&quot;play&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;;
      timerToggle.setAttribute(&#x27;aria-label&#x27;, running ? &#x27;暂停计时&#x27; : &#x27;继续计时&#x27;);
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    });
    root.querySelector(&#x27;.dr-finish-focus&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
      running = false;
      root.querySelector(&#x27;.dr-focus-card&#x27;).style.display = &#x27;none&#x27;;
      const runningTask = root.querySelector(&#x27;.dr-task.is-running&#x27;);
      runningTask.classList.remove(&#x27;is-running&#x27;);
      runningTask.classList.add(&#x27;is-done&#x27;);
      runningTask.querySelector(&#x27;input&#x27;).checked = true;
      runningTask.querySelector(&#x27;.dr-task-status&#x27;).textContent = &#x27;已完成&#x27;;
      refreshDone();
      showToast(&#x27;任务已完成，专注记录已保存&#x27;);
    });

    root.addEventListener(&#x27;click&#x27;, (event) =&gt; {
      const start = event.target.closest(&#x27;.dr-start-button&#x27;);
      if (start) showToast(root.querySelector(&#x27;#dr-dnd&#x27;).checked ? &#x27;计时已开始 · 记得开启勿扰模式&#x27; : &#x27;计时已开始&#x27;);
    });
    root.querySelector(&#x27;#dr-add-meeting&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showToast(&#x27;会议将手动添加，不连接外部日历&#x27;));
    root.querySelector(&#x27;#dr-carry-mode&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; showToast(`未完成任务：${event.target.value}`));
    root.querySelector(&#x27;#dr-save-reminders&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
      const morning = root.querySelector(&#x27;#dr-morning-time&#x27;).value || &#x27;10:30&#x27;;
      const evening = root.querySelector(&#x27;#dr-evening-time&#x27;).value || &#x27;20:00&#x27;;
      root.querySelector(&#x27;#dr-morning-summary&#x27;).textContent = `每日 ${morning} 提醒`;
      root.querySelector(&#x27;#dr-evening-summary&#x27;).textContent = `每日 ${evening} 提醒`;
      showToast(`提醒已更新：${morning} / ${evening}`);
    });
    const bulkDialog = root.querySelector(&#x27;#dr-bulk-dialog&#x27;);
    const closeBulk = () =&gt; bulkDialog.close();
    const updateBulkSummary = () =&gt; {
      const start = new Date(`${root.querySelector(&#x27;#dr-bulk-start&#x27;).value}T00:00:00`);
      const end = new Date(`${root.querySelector(&#x27;#dr-bulk-end&#x27;).value}T00:00:00`);
      const validRange = Number.isFinite(start.getTime()) &amp;&amp; Number.isFinite(end.getTime()) &amp;&amp; end &gt;= start;
      const days = validRange ? Math.floor((end - start) / 86400000) + 1 : 0;
      const tasks = root.querySelectorAll(&#x27;.dr-bulk-tasks input:checked&#x27;).length;
      root.querySelector(&#x27;#dr-bulk-summary&#x27;).textContent = validRange ? `将为 ${days} 天补录 ${days * tasks} 条任务` : &#x27;请选择有效的日期范围&#x27;;
      root.querySelector(&#x27;#dr-confirm-bulk&#x27;).disabled = !validRange || tasks === 0;
    };
    root.querySelector(&#x27;#dr-bulk-add&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
      updateBulkSummary();
      bulkDialog.showModal();
    });
    root.querySelector(&#x27;#dr-close-bulk&#x27;).addEventListener(&#x27;click&#x27;, closeBulk);
    root.querySelector(&#x27;#dr-cancel-bulk&#x27;).addEventListener(&#x27;click&#x27;, closeBulk);
    root.querySelectorAll(&#x27;#dr-bulk-start, #dr-bulk-end, .dr-bulk-tasks input&#x27;).forEach((input) =&gt; input.addEventListener(&#x27;change&#x27;, updateBulkSummary));
    root.querySelector(&#x27;#dr-confirm-bulk&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
      const summary = root.querySelector(&#x27;#dr-bulk-summary&#x27;).textContent;
      closeBulk();
      showToast(summary.replace(&#x27;将为&#x27;, &#x27;已为&#x27;).replace(&#x27;补录&#x27;, &#x27;补录了&#x27;));
    });
    root.querySelector(&#x27;#dr-save-review&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showToast(&#x27;今日复盘已完成，晚安&#x27;));
    root.querySelectorAll(&#x27;.dr-filter-group button&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
      root.querySelectorAll(&#x27;.dr-filter-group button&#x27;).forEach((node) =&gt; node.classList.remove(&#x27;is-selected&#x27;));
      button.classList.add(&#x27;is-selected&#x27;);
    }));
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
